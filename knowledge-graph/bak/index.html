<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人知识图谱</title>
  <style>
    :root {
      --bg: #f3f0e8;
      --panel: rgba(255, 253, 247, 0.92);
      --ink: #20221e;
      --muted: #6f746a;
      --line: #d7d4c9;
      --accent: #184e45;
      --accent-soft: #dceae5;
      --shadow: 0 18px 44px rgba(44, 48, 39, 0.1);
      --event: #df724c;
      --person: #246b61;
      --organization: #7364a8;
      --place: #28739a;
      --project: #bd8b25;
      --assertion: #a9475b;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(223, 114, 76, 0.12), transparent 26%),
        radial-gradient(circle at 90% 90%, rgba(36, 107, 97, 0.12), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 16px;
      gap: 12px;
    }

    .topbar {
      min-height: 68px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 10px 14px 10px 20px;
      border: 1px solid rgba(112, 111, 102, 0.18);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .brand { min-width: 220px; }
    .brand h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: 22px; letter-spacing: .02em; }
    .brand p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: #e9e6dc;
    }

    .segmented button, .ghost-button {
      min-height: 36px;
      padding: 7px 13px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
    }

    .segmented button.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 5px 14px rgba(24, 78, 69, .22);
    }

    .search-wrap { flex: 1; position: relative; max-width: 420px; }
    .search-wrap input {
      width: 100%; height: 40px; padding: 0 14px 0 38px;
      border: 1px solid var(--line); border-radius: 11px;
      color: var(--ink); background: rgba(255,255,255,.72); outline: none;
      font-size: 16px;
    }
    .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24,78,69,.1); }
    .search-wrap::before { content: "⌕"; position: absolute; left: 14px; top: 8px; color: var(--muted); font-size: 20px; }

    .ghost-button { border: 1px solid var(--line); background: rgba(255,255,255,.58); white-space: nowrap; }
    .ghost-button:hover { background: #fff; }
    .stats { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: 224px minmax(420px, 1fr) 310px;
      gap: 12px;
    }

    .panel {
      min-height: 0;
      overflow: auto;
      border: 1px solid rgba(112, 111, 102, 0.18);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .filters, .details { padding: 18px; }
    .panel-title { margin: 0 0 6px; font-size: 14px; letter-spacing: .08em; }
    .panel-intro { margin: 0 0 18px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .filter-group { margin: 0 0 21px; }
    .filter-group h3 { margin: 0 0 9px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }

    .filter-item {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 8px 9px; margin-bottom: 4px;
      border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left;
    }
    .filter-item:hover { background: #f0eee7; }
    .filter-item.off { opacity: .4; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
    .filter-item .count { margin-left: auto; color: var(--muted); font-size: 11px; }

    .canvas-panel { overflow: hidden; position: relative; }
    #graph { width: 100%; height: 100%; display: block; cursor: grab; }
    #graph.panning { cursor: grabbing; }
    .canvas-note {
      position: absolute; left: 16px; bottom: 14px;
      padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px;
      color: var(--muted); background: rgba(255,253,247,.84); font-size: 11px; pointer-events: none;
    }

    .edge { fill: none; stroke-width: 1.5; opacity: .46; }
    .edge.selected { stroke-width: 3; opacity: 1; }
    .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
    .edge-label { fill: #666b61; font-size: 10px; text-anchor: middle; paint-order: stroke; stroke: #f7f4ec; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }

    .node { cursor: pointer; }
    .node circle { stroke: #fffdf7; stroke-width: 3; filter: drop-shadow(0 5px 7px rgba(35,38,32,.16)); }
    .node.candidate circle { stroke-dasharray: 4 3; }
    .node.unresolved circle { stroke: #d14b3f; stroke-dasharray: 2 3; stroke-width: 4; }
    .node.selected circle { stroke: #20221e; stroke-width: 4; stroke-dasharray: none; }
    .node text { fill: #252721; font-size: 11px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: #fffdf7; stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
    .node .node-subtype { fill: #73786e; font-size: 9px; font-weight: 500; }

    .empty-state { margin-top: 70px; text-align: center; color: var(--muted); }
    .detail-type { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 999px; background: #eeece4; font-size: 11px; }
    .detail-title { margin: 14px 0 7px; font-family: Georgia, "Songti SC", serif; font-size: 23px; line-height: 1.35; }
    .detail-description { margin: 0; color: #4f544b; font-size: 14px; line-height: 1.75; }
    .detail-block { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
    .detail-block h3 { margin: 0 0 9px; color: var(--muted); font-size: 11px; letter-spacing: .08em; }
    .property-list { display: grid; grid-template-columns: 76px 1fr; gap: 8px; margin: 0; font-size: 12px; line-height: 1.55; }
    .property-list dt { color: var(--muted); }
    .property-list dd { margin: 0; overflow-wrap: anywhere; }
    .evidence { padding: 12px; border-left: 3px solid var(--accent); border-radius: 4px 10px 10px 4px; background: #eef3ef; font-size: 12px; line-height: 1.65; }
    .connection { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px; margin-bottom: 5px; border: 0; border-radius: 9px; background: #f1efe8; cursor: pointer; text-align: left; }
    .connection:hover { background: #e8e5db; }
    .connection small { display: block; color: var(--muted); margin-top: 2px; }
    .status-pill { padding: 2px 7px; border-radius: 999px; font-size: 10px; background: #efe6cf; }
    .status-pill.confirmed { background: #dceae5; color: #184e45; }
    .status-pill.unresolved { background: #f6dbd6; color: #8d3129; }

    .load-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 30px; text-align: center; background: var(--panel); z-index: 10; }
    .load-error[hidden] { display: none; }
    .load-card { max-width: 480px; }
    .load-card h2 { margin: 0 0 10px; }
    .load-card p { color: var(--muted); line-height: 1.7; }
    .file-label { display: inline-block; padding: 9px 14px; color: #fff; background: var(--accent); border-radius: 10px; cursor: pointer; }
    .file-label input { display: none; }

    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 190px minmax(360px, 1fr) 270px; }
      .brand { min-width: 170px; }
    }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .topbar { flex-wrap: wrap; }
      .search-wrap { order: 3; max-width: none; flex-basis: 100%; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: 66vh auto auto; }
      .canvas-panel { order: -1; }
      .filters { display: flex; gap: 18px; overflow-x: auto; }
      .filter-group { min-width: 180px; }
      .details { min-height: 280px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>个人知识图谱</h1>
        <p id="updatedAt">正在读取数据…</p>
      </div>
      <div class="segmented" aria-label="视图切换">
        <button type="button" data-view="schema">类型图</button>
        <button type="button" data-view="instances" class="active">实例图</button>
      </div>
      <label class="search-wrap">
        <input id="search" type="search" placeholder="查找人物、事件、项目…" aria-label="查找节点" />
      </label>
      <button id="resetView" class="ghost-button" type="button">重置视图</button>
      <div id="stats" class="stats">—</div>
    </header>

    <section class="workspace">
      <aside class="panel filters">
        <div>
          <h2 class="panel-title">显示范围</h2>
          <p class="panel-intro">点击类别可隐藏或显示。虚线节点代表候选，红色虚线代表待消歧。</p>
        </div>
        <div id="nodeFilters" class="filter-group"></div>
        <div id="edgeFilters" class="filter-group"></div>
      </aside>

      <section class="panel canvas-panel">
        <svg id="graph" role="img" aria-label="知识图谱"></svg>
        <div class="canvas-note">滚轮缩放 · 拖动画布 · 拖动节点 · 点击查看详情</div>
        <div id="loadError" class="load-error" hidden>
          <div class="load-card">
            <h2>请选择数据文件</h2>
            <p>浏览器直接打开本地 HTML 时无法自动读取 JSON。请选择同目录下的 <strong>data.json</strong>，或通过本地静态服务器打开本页。</p>
            <label class="file-label">选择 data.json<input id="fileInput" type="file" accept="application/json,.json" /></label>
          </div>
        </div>
      </section>

      <aside id="details" class="panel details">
        <div class="empty-state">点击一个节点或关系<br />查看属性、证据与连接</div>
      </aside>
    </section>
  </main>

  <script>
    const COLORS = {
      "事件": "#df724c", "人物": "#246b61", "组织": "#7364a8",
      "地点": "#28739a", "项目": "#bd8b25", "个人陈述": "#a9475b"
    };
    const EDGE_COLORS = {
      "参与事件": "#59736c", "发生于": "#4584a3", "涉及对象": "#8b8374",
      "人物关系": "#7b5c96", "隶属于": "#796f99", "表达": "#a9475b", "来源于": "#b86d7b"
    };

    const state = {
      data: null, view: "instances", hiddenNodeTypes: new Set(), hiddenEdgeTypes: new Set(),
      query: "", positions: { schema: {}, instances: {} }, transform: { x: 0, y: 0, k: 1 },
      selected: null, simulationFrame: null
    };

    const svg = document.querySelector("#graph");
    const details = document.querySelector("#details");
    const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));

    async function loadDefaultData() {
      try {
        const response = await fetch("./data.json", { cache: "no-store" });
        if (!response.ok) throw new Error("data.json 读取失败");
        initialize(await response.json());
      } catch (error) {
        document.querySelector("#loadError").hidden = false;
      }
    }

    function initialize(data) {
      validateData(data);
      state.data = data;
      document.querySelector("#loadError").hidden = true;
      document.querySelector("#updatedAt").textContent = `数据日期 ${data.meta.sourceDates.join("、")} · 更新于 ${data.meta.updatedAt}`;
      bindControls();
      resetView(true);
    }

    function validateData(data) {
      if (!data?.schema?.nodes || !data?.instances?.nodes) throw new Error("数据格式不完整");
      for (const section of [data.schema, data.instances]) {
        const ids = new Set(section.nodes.map(node => node.id));
        if (ids.size !== section.nodes.length) throw new Error("存在重复节点 ID");
        for (const edge of section.edges) {
          if (!ids.has(edge.source) || !ids.has(edge.target)) throw new Error(`关系 ${edge.id} 引用了不存在的节点`);
        }
      }
    }

    let controlsBound = false;
    function bindControls() {
      if (controlsBound) return;
      controlsBound = true;
      document.querySelectorAll("[data-view]").forEach(button => button.addEventListener("click", () => {
        state.view = button.dataset.view;
        state.hiddenNodeTypes.clear();
        state.hiddenEdgeTypes.clear();
        state.selected = null;
        document.querySelectorAll("[data-view]").forEach(item => item.classList.toggle("active", item === button));
        resetView(true);
      }));
      document.querySelector("#search").addEventListener("input", event => {
        state.query = event.target.value.trim().toLowerCase();
        renderGraph(false);
      });
      document.querySelector("#resetView").addEventListener("click", () => resetView(false));
      document.querySelector("#fileInput").addEventListener("change", async event => {
        const file = event.target.files[0];
        if (!file) return;
        try { initialize(JSON.parse(await file.text())); }
        catch (error) { alert(`数据文件无法读取：${error.message}`); }
      });
      bindCanvasControls();
      window.addEventListener("resize", () => renderGraph(false));
    }

    function currentSection() { return state.data[state.view]; }
    function visibleData() {
      const section = currentSection();
      const matchedIds = new Set();
      for (const node of section.nodes) {
        const haystack = [node.label, node.type, node.subtype, node.description].filter(Boolean).join(" ").toLowerCase();
        if (!state.query || haystack.includes(state.query)) matchedIds.add(node.id);
      }
      const nodes = section.nodes.filter(node => !state.hiddenNodeTypes.has(node.type) && matchedIds.has(node.id));
      const ids = new Set(nodes.map(node => node.id));
      const edges = section.edges.filter(edge => ids.has(edge.source) && ids.has(edge.target) && !state.hiddenEdgeTypes.has(edge.type));
      return { nodes, edges };
    }

    function resetView(reseed) {
      const rect = svg.getBoundingClientRect();
      state.transform = { x: rect.width / 2, y: rect.height / 2, k: state.view === "instances" ? .62 : .9 };
      if (reseed) state.positions[state.view] = {};
      state.selected = null;
      details.innerHTML = '<div class="empty-state">点击一个节点或关系<br />查看属性、证据与连接</div>';
      buildFilters();
      seedPositions();
      renderGraph(true);
    }

    function seedPositions() {
      const section = currentSection();
      const positions = state.positions[state.view];
      const groups = [...new Set(section.nodes.map(node => node.type))];
      section.nodes.forEach((node, index) => {
        if (positions[node.id]) return;
        const groupIndex = groups.indexOf(node.type);
        const inGroup = section.nodes.filter(item => item.type === node.type);
        const localIndex = inGroup.findIndex(item => item.id === node.id);
        const groupAngle = groupIndex / groups.length * Math.PI * 2 - Math.PI / 2;
        const centerRadius = state.view === "schema" ? 85 : 230;
        const spread = state.view === "schema" ? 0 : 48 + Math.floor(localIndex / 6) * 42;
        const localAngle = (localIndex % 6) / Math.min(6, inGroup.length) * Math.PI * 2;
        positions[node.id] = {
          x: Math.cos(groupAngle) * centerRadius + Math.cos(localAngle) * spread,
          y: Math.sin(groupAngle) * centerRadius + Math.sin(localAngle) * spread,
          vx: 0, vy: 0
        };
      });
    }

    function buildFilters() {
      const section = currentSection();
      const nodeTypes = [...new Set(section.nodes.map(node => node.type))];
      const edgeTypes = [...new Set(section.edges.map(edge => edge.type))];
      document.querySelector("#nodeFilters").innerHTML = `<h3>节点类型</h3>${nodeTypes.map(type => filterButton(type, "node", section.nodes.filter(n => n.type === type).length, COLORS[type])).join("")}`;
      document.querySelector("#edgeFilters").innerHTML = `<h3>关系类型</h3>${edgeTypes.map(type => filterButton(type, "edge", section.edges.filter(e => e.type === type).length, EDGE_COLORS[type])).join("")}`;
      document.querySelectorAll(".filter-item").forEach(button => button.addEventListener("click", () => {
        const target = button.dataset.kind === "node" ? state.hiddenNodeTypes : state.hiddenEdgeTypes;
        target.has(button.dataset.value) ? target.delete(button.dataset.value) : target.add(button.dataset.value);
        button.classList.toggle("off", target.has(button.dataset.value));
        renderGraph(true);
      }));
    }

    function filterButton(value, kind, count, color) {
      const hidden = kind === "node" ? state.hiddenNodeTypes.has(value) : state.hiddenEdgeTypes.has(value);
      return `<button class="filter-item ${hidden ? "off" : ""}" data-kind="${kind}" data-value="${escapeHtml(value)}"><span class="dot" style="background:${color || "#888"}"></span><span>${escapeHtml(value)}</span><span class="count">${count}</span></button>`;
    }

    function renderGraph(runSimulation) {
      if (!state.data) return;
      cancelAnimationFrame(state.simulationFrame);
      const { nodes, edges } = visibleData();
      const positions = state.positions[state.view];
      const selectedId = state.selected?.id;
      const defs = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="19" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#77776e"></path></marker></defs>`;
      const edgeMarkup = edges.map((edge, index) => {
        const d = edgePath(edge, edges, positions);
        const color = EDGE_COLORS[edge.type] || "#888";
        const selected = selectedId === edge.id;
        return `<g data-edge="${edge.id}"><path class="edge ${selected ? "selected" : ""}" d="${d}" stroke="${color}" marker-end="url(#arrow)"></path><path class="edge-hit" d="${d}"></path><text class="edge-label" data-edge-label="${edge.id}">${escapeHtml(edge.label || edge.type)}</text></g>`;
      }).join("");
      const nodeMarkup = nodes.map(node => {
        const p = positions[node.id];
        const radius = state.view === "schema" ? 35 : (node.type === "事件" ? 28 : 23);
        const selected = selectedId === node.id;
        const label = node.label.length > 13 ? `${node.label.slice(0, 12)}…` : node.label;
        const subtype = node.subtype ? `<text class="node-subtype" y="${radius + 25}">${escapeHtml(node.subtype)}</text>` : "";
        return `<g class="node ${node.status || "candidate"} ${selected ? "selected" : ""}" data-node="${node.id}" transform="translate(${p.x},${p.y})"><circle r="${radius}" fill="${COLORS[node.type] || "#777"}" fill-opacity=".92"></circle><text y="${radius + 14}">${escapeHtml(label)}</text>${subtype}</g>`;
      }).join("");
      svg.innerHTML = `${defs}<g id="viewport" transform="translate(${state.transform.x} ${state.transform.y}) scale(${state.transform.k})"><g id="edges">${edgeMarkup}</g><g id="nodes">${nodeMarkup}</g></g>`;
      updateEdgeLabels(edges, positions);
      bindGraphItems();
      document.querySelector("#stats").textContent = `${nodes.length} 个节点 · ${edges.length} 条关系`;
      if (runSimulation && nodes.length < 80) startSimulation(nodes, edges);
    }

    function edgePath(edge, allEdges, positions) {
      const a = positions[edge.source], b = positions[edge.target];
      if (edge.source === edge.target) return `M ${a.x - 12} ${a.y - 18} C ${a.x - 62} ${a.y - 80}, ${a.x + 62} ${a.y - 80}, ${a.x + 12} ${a.y - 18}`;
      const siblings = allEdges.filter(item => (item.source === edge.source && item.target === edge.target) || (item.source === edge.target && item.target === edge.source));
      const offsetIndex = siblings.indexOf(edge) - (siblings.length - 1) / 2;
      const dx = b.x - a.x, dy = b.y - a.y, distance = Math.hypot(dx, dy) || 1;
      const curve = offsetIndex * 22;
      const cx = (a.x + b.x) / 2 - dy / distance * curve;
      const cy = (a.y + b.y) / 2 + dx / distance * curve;
      return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
    }

    function updateEdgeLabels(edges, positions) {
      edges.forEach(edge => {
        const label = svg.querySelector(`[data-edge-label="${CSS.escape(edge.id)}"]`);
        const a = positions[edge.source], b = positions[edge.target];
        if (!label) return;
        label.setAttribute("x", (a.x + b.x) / 2);
        label.setAttribute("y", (a.y + b.y) / 2 - 5);
      });
    }

    function bindGraphItems() {
      svg.querySelectorAll("[data-node]").forEach(group => {
        group.addEventListener("click", event => { event.stopPropagation(); selectNode(group.dataset.node); });
        group.addEventListener("pointerdown", event => beginNodeDrag(event, group.dataset.node));
      });
      svg.querySelectorAll("[data-edge]").forEach(group => group.addEventListener("click", event => {
        event.stopPropagation(); selectEdge(group.dataset.edge);
      }));
    }

    function selectNode(id) {
      const section = currentSection();
      const node = section.nodes.find(item => item.id === id);
      state.selected = node;
      renderDetailsForNode(node);
      renderGraph(false);
    }

    function selectEdge(id) {
      const section = currentSection();
      const edge = section.edges.find(item => item.id === id);
      state.selected = edge;
      renderDetailsForEdge(edge);
      renderGraph(false);
    }

    function renderDetailsForNode(node) {
      const section = currentSection();
      const connections = section.edges.filter(edge => edge.source === node.id || edge.target === node.id);
      const visibleProps = [["状态", statusLabel(node.status)], ["日期", node.date], ["子类型", node.subtype], ["陈述性质", node.statementKind]].filter(([,value]) => value);
      details.innerHTML = `
        <span class="detail-type"><span class="dot" style="background:${COLORS[node.type] || "#777"}"></span>${escapeHtml(node.type)}</span>
        <h2 class="detail-title">${escapeHtml(node.label)}</h2>
        <p class="detail-description">${escapeHtml(node.description || "暂无说明")}</p>
        ${visibleProps.length ? `<div class="detail-block"><h3>属性</h3><dl class="property-list">${visibleProps.map(([key,value]) => `<dt>${key}</dt><dd>${escapeHtml(value)}</dd>`).join("")}</dl></div>` : ""}
        ${node.evidence ? `<div class="detail-block"><h3>证据摘录</h3><div class="evidence">${escapeHtml(node.evidence)}</div></div>` : ""}
        <div class="detail-block"><h3>连接关系 · ${connections.length}</h3>${connections.length ? connections.map(edge => connectionMarkup(edge, node.id)).join("") : '<p class="panel-intro">暂无连接</p>'}</div>`;
      details.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => selectNode(button.dataset.jump)));
    }

    function connectionMarkup(edge, currentId) {
      const section = currentSection();
      const otherId = edge.source === currentId ? edge.target : edge.source;
      const other = section.nodes.find(node => node.id === otherId);
      const direction = edge.source === currentId ? "→" : "←";
      return `<button class="connection" data-jump="${otherId}"><span class="dot" style="background:${COLORS[other.type] || "#777"}"></span><span><strong>${direction} ${escapeHtml(edge.label || edge.type)}</strong><small>${escapeHtml(other.label)}</small></span></button>`;
    }

    function renderDetailsForEdge(edge) {
      const section = currentSection();
      const source = section.nodes.find(node => node.id === edge.source);
      const target = section.nodes.find(node => node.id === edge.target);
      details.innerHTML = `
        <span class="detail-type"><span class="dot" style="background:${EDGE_COLORS[edge.type] || "#777"}"></span>${escapeHtml(edge.type)}</span>
        <h2 class="detail-title">${escapeHtml(edge.label || edge.type)}</h2>
        <div class="detail-block"><h3>关系方向</h3><button class="connection" data-jump="${source.id}"><span class="dot" style="background:${COLORS[source.type]}"></span><span>${escapeHtml(source.label)}</span></button><div style="padding:4px 18px;color:var(--muted)">↓ ${escapeHtml(edge.label || edge.type)}</div><button class="connection" data-jump="${target.id}"><span class="dot" style="background:${COLORS[target.type]}"></span><span>${escapeHtml(target.label)}</span></button></div>
        ${edge.evidence ? `<div class="detail-block"><h3>证据摘录</h3><div class="evidence">${escapeHtml(edge.evidence)}</div></div>` : ""}`;
      details.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => selectNode(button.dataset.jump)));
    }

    function statusLabel(status) { return ({confirmed:"已确认", candidate:"候选", unresolved:"待消歧"})[status] || status; }

    function startSimulation(nodes, edges) {
      const positions = state.positions[state.view];
      let tick = 0;
      function step() {
        tick += 1;
        const alpha = Math.max(0, 1 - tick / 220);
        for (let i = 0; i < nodes.length; i++) {
          const a = positions[nodes[i].id];
          for (let j = i + 1; j < nodes.length; j++) {
            const b = positions[nodes[j].id];
            let dx = b.x - a.x, dy = b.y - a.y;
            const d2 = Math.max(500, dx * dx + dy * dy);
            const force = (state.view === "schema" ? 2500 : 1450) / d2 * alpha;
            const d = Math.sqrt(d2); dx /= d; dy /= d;
            a.vx -= dx * force; a.vy -= dy * force; b.vx += dx * force; b.vy += dy * force;
          }
        }
        edges.forEach(edge => {
          const a = positions[edge.source], b = positions[edge.target];
          if (!a || !b || a === b) return;
          const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx,dy) || 1;
          const ideal = state.view === "schema" ? 170 : 118;
          const force = (d - ideal) * .006 * alpha;
          a.vx += dx / d * force; a.vy += dy / d * force;
          b.vx -= dx / d * force; b.vy -= dy / d * force;
        });
        nodes.forEach(node => {
          const p = positions[node.id];
          p.vx += -p.x * .00025 * alpha; p.vy += -p.y * .00025 * alpha;
          p.vx *= .82; p.vy *= .82; p.x += p.vx; p.y += p.vy;
        });
        updatePositions(nodes, edges);
        if (tick < 220) state.simulationFrame = requestAnimationFrame(step);
      }
      state.simulationFrame = requestAnimationFrame(step);
    }

    function updatePositions(nodes, edges) {
      const positions = state.positions[state.view];
      nodes.forEach(node => {
        const group = svg.querySelector(`[data-node="${CSS.escape(node.id)}"]`);
        const p = positions[node.id];
        if (group) group.setAttribute("transform", `translate(${p.x},${p.y})`);
      });
      edges.forEach(edge => {
        const group = svg.querySelector(`[data-edge="${CSS.escape(edge.id)}"]`);
        if (!group) return;
        const d = edgePath(edge, edges, positions);
        group.querySelectorAll("path").forEach(path => path.setAttribute("d", d));
      });
      updateEdgeLabels(edges, positions);
    }

    function graphPoint(event) {
      const rect = svg.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left - state.transform.x) / state.transform.k,
        y: (event.clientY - rect.top - state.transform.y) / state.transform.k
      };
    }

    let dragState = null;
    function beginNodeDrag(event, nodeId) {
      event.stopPropagation();
      event.currentTarget.setPointerCapture(event.pointerId);
      dragState = { type: "node", nodeId, pointerId: event.pointerId };
      cancelAnimationFrame(state.simulationFrame);
    }

    function bindCanvasControls() {
      svg.addEventListener("pointerdown", event => {
        if (event.target.closest("[data-node], [data-edge]")) return;
        svg.setPointerCapture(event.pointerId);
        dragState = { type: "canvas", pointerId: event.pointerId, clientX: event.clientX, clientY: event.clientY, startX: state.transform.x, startY: state.transform.y };
        svg.classList.add("panning");
      });
      svg.addEventListener("pointermove", event => {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        if (dragState.type === "node") {
          const point = graphPoint(event), p = state.positions[state.view][dragState.nodeId];
          p.x = point.x; p.y = point.y; p.vx = 0; p.vy = 0;
          const visible = visibleData(); updatePositions(visible.nodes, visible.edges);
        } else {
          state.transform.x = dragState.startX + event.clientX - dragState.clientX;
          state.transform.y = dragState.startY + event.clientY - dragState.clientY;
          applyTransform();
        }
      });
      const endDrag = () => { dragState = null; svg.classList.remove("panning"); };
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);
      svg.addEventListener("wheel", event => {
        event.preventDefault();
        const rect = svg.getBoundingClientRect();
        const mx = event.clientX - rect.left, my = event.clientY - rect.top;
        const oldK = state.transform.k;
        const newK = Math.min(2.4, Math.max(.32, oldK * Math.exp(-event.deltaY * .001)));
        state.transform.x = mx - (mx - state.transform.x) * newK / oldK;
        state.transform.y = my - (my - state.transform.y) * newK / oldK;
        state.transform.k = newK;
        applyTransform();
      }, { passive: false });
      svg.addEventListener("click", event => {
        if (event.target === svg || event.target.id === "viewport") {
          state.selected = null; details.innerHTML = '<div class="empty-state">点击一个节点或关系<br />查看属性、证据与连接</div>'; renderGraph(false);
        }
      });
    }

    function applyTransform() {
      const viewport = svg.querySelector("#viewport");
      if (viewport) viewport.setAttribute("transform", `translate(${state.transform.x} ${state.transform.y}) scale(${state.transform.k})`);
    }

    loadDefaultData();
  </script>
</body>
</html>
